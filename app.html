<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pen Tube OS - Creator Engine</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-8">
    <header class="mb-10 flex justify-between items-center">
        <h2 class="text-3xl glow-text font-bold">Creator Engine</h2>
        <a href="dashboard.html" class="text-cyan-400 hover:underline">Access Creator Vault</a>
    </header>

    <div class="glass-panel w-full max-w-5xl mx-auto">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('seo')">SEO & Keywords</button>
            <button class="tab-btn" onclick="switchTab('script')">Script Outline</button>
            <button class="tab-btn" onclick="switchTab('thumb')">Thumbnail AI</button>
        </div>

        <!-- Input Area -->
        <div class="mb-8">
            <label class="block text-gray-300 mb-2">Video Idea / Topic</label>
            <input type="text" id="videoIdea" class="w-full bg-black border border-gray-700 text-white p-3 rounded-lg focus:border-cyan-400 outline-none" placeholder="e.g., Far Cry 3 Ultra Graphics Gameplay or Free Fire Headshot Config">
        </div>

        <!-- UIVERSE FILE #5: FILE UPLOAD (Hidden by default, used in Thumbnail tab) -->
        <div id="uploadZone" class="hidden flex justify-center mb-8">
            <label for="file" class="custum-file-upload">
                <div class="icon"><svg viewBox="0 0 24 24" fill="" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M10 1C9.73478 1 9.48043 1.10536 9.29289 1.29289L3.29289 7.29289C3.10536 7.48043 3 7.73478 3 8V20C3 21.6569 4.34315 23 6 23H7C7.55228 23 8 22.5523 8 22C8 21.4477 7.55228 21 7 21H6C5.44772 21 5 20.5523 5 20V9H10C10.5523 9 11 8.55228 11 8V3H18C18.5523 3 19 3.44772 19 4V9C19 9.55228 19.4477 10 20 10C20.5523 10 21 9.55228 21 9V4C21 2.34315 19.6569 1 18 1H10ZM9 7H6.41421L9 4.41421V7ZM14 15.5C14 14.1193 15.1193 13 16.5 13C17.8807 13 19 14.1193 19 15.5V16V17H20C21.1046 17 22 17.8954 22 19C22 20.1046 21.1046 21 20 21H13C11.8954 21 11 20.1046 11 19C11 17.8954 11.8954 17 13 17H14V16V15.5ZM16.5 11C14.142 11 12.2076 12.8136 12.0156 15.122C10.2825 15.5606 9 17.1305 9 19C9 21.2091 10.7909 23 13 23H20C22.2091 23 24 21.2091 24 19C24 17.1305 22.7175 15.5606 20.9844 15.122C20.7924 12.8136 18.858 11 16.5 11Z" fill=""></path></svg></div>
                <div class="text"><span>Upload Reference (Optional)</span></div>
                <input id="file" type="file">
            </label>
        </div>

        <!-- UIVERSE FILE #2: SPARKLE BUTTON -->
        <div class="flex justify-center mb-8">
            <button class="gen-button" id="generateBtn">
                <div class="dots_border"></div>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="sparkle">
                    <path class="path" stroke-linejoin="round" stroke-linecap="round" stroke="white" fill="white" d="M14.187 8.096L15 5.25L15.813 8.096C16.0231 8.83114 16.4171 9.50062 16.9577 10.0413C17.4984 10.5819 18.1679 10.9759 18.903 11.186L21.75 12L18.904 12.813C18.1689 13.0231 17.4994 13.4171 16.9587 13.9577C16.4181 14.4984 16.0241 15.1679 15.814 15.903L15 18.75L14.187 15.904C13.9769 15.1689 13.5829 14.4994 13.0423 13.9587C12.5016 13.4181 11.8321 13.0241 11.097 12.814L8.25 12L11.096 11.187C11.8311 10.9769 12.5006 10.5829 13.0413 10.0423C13.5819 9.50162 13.9759 8.83214 14.186 8.097L14.187 8.096Z"></path>
                </svg>
                <span class="text_button">Generate !</span>
            </button>
        </div>

        <!-- UIVERSE FILE #3: SKELETON LOADER -->
        <div id="loader" class="hidden relative flex w-full animate-pulse gap-2 p-4 justify-center">
            <div class="h-12 w-12 rounded-full bg-slate-700"></div>
            <div class="flex-1 max-w-lg">
                <div class="mb-2 h-5 w-3/5 rounded-lg bg-slate-700 text-lg"></div>
                <div class="h-5 w-[90%] rounded-lg bg-slate-700 text-sm"></div>
            </div>
        </div>

        <!-- Output Console -->
        <div id="outputContainer" class="hidden bg-black border border-gray-800 p-6 rounded-lg relative min-h-[200px]">
            <h4 class="text-cyan-400 mb-2 font-mono">_SYSTEM.OUTPUT_</h4>
            <pre id="resultText" class="text-gray-300 whitespace-pre-wrap font-mono text-sm"></pre>
            
            <div class="mt-6 flex justify-end gap-4">
                <!-- UIVERSE FILE #1: DOWNLOAD BUTTON -->
                <button type="button" class="dl-button" id="downloadBtn">
                    <span class="button__text">Download</span>
                    <span class="button__icon"><svg class="svg" viewBox="0 0 35 35" xmlns="http://www.w3.org/2000/svg"><path d="M17.5,22.131a1.249,1.249,0,0,1-1.25-1.25V2.187a1.25,1.25,0,0,1,2.5,0V20.881A1.25,1.25,0,0,1,17.5,22.131Z"></path><path d="M17.5,22.693a3.189,3.189,0,0,1-2.262-.936L8.487,15.006a1.249,1.249,0,0,1,1.767-1.767l6.751,6.751a.7.7,0,0,0,.99,0l6.751-6.751a1.25,1.25,0,0,1,1.768,1.767l-6.752,6.751A3.191,3.191,0,0,1,17.5,22.693Z"></path><path d="M31.436,34.063H3.564A3.318,3.318,0,0,1,.25,30.749V22.011a1.25,1.25,0,0,1,2.5,0v8.738a.815.815,0,0,0,.814.814H31.436a.815.815,0,0,0,.814-.814V22.011a1.25,1.25,0,1,1,2.5,0v8.738A3.318,3.318,0,0,1,31.436,34.063Z"></path></svg></span>
                </button>
            </div>
        </div>
    </div>
    
    <script type="module" src="app.js"></script>
    <script type="module" src="firebase-app.js"></script>
</body>
</html>
